<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="Optical and SAR fusion producing a cloud-free result" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a2f"/><stop offset="1" stop-color="#5a6e3d"/></linearGradient>
  <pattern id="fld" width="46" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><rect width="23" height="19" fill="#6b7f45" opacity=".35"/><rect x="23" y="19" width="23" height="19" fill="#4a5b33" opacity=".4"/></pattern>
  <clipPath id="pc"><rect width="300" height="230" rx="8"/></clipPath>
  <filter id="cb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="sp" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.2" intercept="-.1"/></feComponentTransfer></filter>
  <mask id="inv" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="230"><rect width="300" height="230" fill="#fff"/><g filter="url(#cb)"><animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><ellipse cx="70" cy="60" rx="62" ry="26" fill="#000"/><ellipse cx="150" cy="112" rx="72" ry="30" fill="#000"/><ellipse cx="235" cy="58" rx="52" ry="22" fill="#000"/><ellipse cx="108" cy="176" rx="66" ry="26" fill="#000"/><ellipse cx="244" cy="168" rx="58" ry="24" fill="#000"/></g></mask>
</defs>
<rect width="1100" height="400" rx="14" fill="#030f1c"/><rect x=".5" y=".5" width="1099" height="399" rx="14" fill="none" stroke="#12384d"/>
<text x="40" y="46" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Multi-sensor fallback</text>
<text x="40" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="1.8" fill="#38bdf8">OPTICAL  ·  CARTOSAT-3</text>
        <g transform="translate(40 90)"><g clip-path="url(#pc)"><rect width="300" height="230" fill="url(#land)"/><rect width="300" height="230" fill="url(#fld)"/><path d="M-10 150C60 70 120 190 180 120S270 60 320 110" fill="none" stroke="#2b7ea6" stroke-width="12" stroke-linecap="round"/><rect x="205" y="150" width="9" height="7" fill="#b4bcc4"/><rect x="218" y="154" width="9" height="7" fill="#b4bcc4"/><rect x="210" y="164" width="9" height="7" fill="#b4bcc4"/><rect x="226" y="166" width="9" height="7" fill="#b4bcc4"/><rect x="120" y="40" width="9" height="7" fill="#b4bcc4"/><rect x="134" y="44" width="9" height="7" fill="#b4bcc4"/><rect x="126" y="54" width="9" height="7" fill="#b4bcc4"/><g filter="url(#cb)"><animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/><ellipse cx="70" cy="60" rx="62" ry="26" fill="#f8fafc"/><ellipse cx="150" cy="112" rx="72" ry="30" fill="#f8fafc"/><ellipse cx="235" cy="58" rx="52" ry="22" fill="#f8fafc"/><ellipse cx="108" cy="176" rx="66" ry="26" fill="#f8fafc"/><ellipse cx="244" cy="168" rx="58" ry="24" fill="#f8fafc"/></g></g><rect width="300" height="230" rx="8" fill="none" stroke="#143d57"/></g>
        <text x="40" y="346" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8aa4ba">Sharp detail, but clouds block the view</text><text x="400" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="1.8" fill="#38bdf8">SAR  ·  RISAT-2B</text>
        <g transform="translate(400 90)"><g clip-path="url(#pc)"><rect width="300" height="230" fill="#1b2024"/><rect width="300" height="230" fill="#000" filter="url(#sp)" opacity=".6"/><path d="M-10 150C60 70 120 190 180 120S270 60 320 110" fill="none" stroke="#06080a" stroke-width="12" stroke-linecap="round"/><rect x="205" y="150" width="9" height="7" fill="#f1f5f9"/><rect x="218" y="154" width="9" height="7" fill="#f1f5f9"/><rect x="210" y="164" width="9" height="7" fill="#f1f5f9"/><rect x="226" y="166" width="9" height="7" fill="#f1f5f9"/><rect x="120" y="40" width="9" height="7" fill="#f1f5f9"/><rect x="134" y="44" width="9" height="7" fill="#f1f5f9"/><rect x="126" y="54" width="9" height="7" fill="#f1f5f9"/></g><rect width="300" height="230" rx="8" fill="none" stroke="#143d57"/></g>
        <text x="400" y="346" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8aa4ba">Sees through clouds, day and night</text><text x="760" y="70" font-family="'SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace" font-size="11" letter-spacing="1.8" fill="#38bdf8">FUSED OUTPUT</text>
        <g transform="translate(760 90)"><g clip-path="url(#pc)"><rect width="300" height="230" fill="#1b2024"/><rect width="300" height="230" fill="#000" filter="url(#sp)" opacity=".6"/><path d="M-10 150C60 70 120 190 180 120S270 60 320 110" fill="none" stroke="#06080a" stroke-width="12" stroke-linecap="round"/><rect x="205" y="150" width="9" height="7" fill="#f1f5f9"/><rect x="218" y="154" width="9" height="7" fill="#f1f5f9"/><rect x="210" y="164" width="9" height="7" fill="#f1f5f9"/><rect x="226" y="166" width="9" height="7" fill="#f1f5f9"/><rect x="120" y="40" width="9" height="7" fill="#f1f5f9"/><rect x="134" y="44" width="9" height="7" fill="#f1f5f9"/><rect x="126" y="54" width="9" height="7" fill="#f1f5f9"/><g mask="url(#inv)"><rect width="300" height="230" fill="url(#land)"/><rect width="300" height="230" fill="url(#fld)"/><path d="M-10 150C60 70 120 190 180 120S270 60 320 110" fill="none" stroke="#2b7ea6" stroke-width="12" stroke-linecap="round"/><rect x="205" y="150" width="9" height="7" fill="#b4bcc4"/><rect x="218" y="154" width="9" height="7" fill="#b4bcc4"/><rect x="210" y="164" width="9" height="7" fill="#b4bcc4"/><rect x="226" y="166" width="9" height="7" fill="#b4bcc4"/><rect x="120" y="40" width="9" height="7" fill="#b4bcc4"/><rect x="134" y="44" width="9" height="7" fill="#b4bcc4"/><rect x="126" y="54" width="9" height="7" fill="#b4bcc4"/></g></g><rect width="300" height="230" rx="8" fill="none" stroke="#143d57"/><rect width="300" height="230" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.8"><animate attributeName="stroke-opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></rect></g>
        <text x="760" y="346" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#8aa4ba">Optical where clear, SAR where clouded</text><text x="370" y="217.0" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" fill="#22d3ee"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0s" repeatCount="indefinite"/>+</text><text x="730" y="217.0" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" fill="#22d3ee"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>=</text></svg>